# /etc/pipewire/pipewire.conf.d/99-macbook-dsp.conf
# 9-Stage Acoustic Tuning and Anti-Clipping Limiter for MacBook Pro 12,1 (CS4208)
# Balances audio between top tweeters and bottom woofers while preventing distortion.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Pro DSP Filter Chain"
            media.name       = "MacBook Pro DSP Filter Chain"
            filter.graph = {
                nodes = [
                    # Stage 1: High-Pass Filter (65Hz) to protect woofers from sub-bass excursion
                    {
                        type  = builtin
                        name  = eq_hp65
                        label = bq_highpass
                        control = { "Freq" = 65.0 "Q" = 0.707 }
                    }
                    # Stage 2: Low-Shelf Bass Lift (120Hz, +3.5dB) for rich low-end
                    {
                        type  = builtin
                        name  = eq_ls120
                        label = bq_lowshelf
                        control = { "Freq" = 120.0 "Gain" = 3.5 "Q" = 0.8 }
                    }
                    # Stage 3: Low-Mid Warmth (250Hz, +1.5dB)
                    {
                        type  = builtin
                        name  = eq_pk250
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Gain" = 1.5 "Q" = 1.2 }
                    }
                    # Stage 4: Mid-Cut Boxiness Removal (500Hz, -2.0dB)
                    {
                        type  = builtin
                        name  = eq_pk500
                        label = bq_peaking
                        control = { "Freq" = 500.0 "Gain" = -2.0 "Q" = 1.0 }
                    }
                    # Stage 5: Aluminum Body Resonance Notch (1250Hz, -3.0dB)
                    {
                        type  = builtin
                        name  = eq_pk1250
                        label = bq_peaking
                        control = { "Freq" = 1250.0 "Gain" = -3.0 "Q" = 2.0 }
                    }
                    # Stage 6: Vocal Presence & Clarity (3200Hz, +2.0dB)
                    {
                        type  = builtin
                        name  = eq_pk3200
                        label = bq_peaking
                        control = { "Freq" = 3200.0 "Gain" = 2.0 "Q" = 1.4 }
                    }
                    # Stage 7: High-Shelf Air & Sparkle (9500Hz, +2.5dB)
                    {
                        type  = builtin
                        name  = eq_hs9500
                        label = bq_highshelf
                        control = { "Freq" = 9500.0 "Gain" = 2.5 "Q" = 0.7 }
                    }
                    # Stage 8: Ultrasonic Attenuation (19000Hz)
                    {
                        type  = builtin
                        name  = eq_lp19k
                        label = bq_lowpass
                        control = { "Freq" = 19000.0 "Q" = 0.707 }
                    }
                    # Stage 9: Output Gain Adjustment (-1.5dB headroom)
                    {
                        type  = builtin
                        name  = gain_stage
                        label = copy
                    }
                ]
                links = [
                    { output = "eq_hp65:Out"   input = "eq_ls120:In" }
                    { output = "eq_ls120:Out"  input = "eq_pk250:In" }
                    { output = "eq_pk250:Out"  input = "eq_pk500:In" }
                    { output = "eq_pk500:Out"  input = "eq_pk1250:In" }
                    { output = "eq_pk1250:Out" input = "eq_pk3200:In" }
                    { output = "eq_pk3200:Out" input = "eq_hs9500:In" }
                    { output = "eq_hs9500:Out" input = "eq_lp19k:In" }
                    { output = "eq_lp19k:Out"  input = "gain_stage:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.macbook_dsp"
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name   = "effect_output.macbook_dsp"
                node.passive = true
            }
        }
    }
]
