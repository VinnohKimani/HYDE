# /etc/sysctl.d/99-vm.conf
# Anti-stutter Virtual Memory (VM) and Swap Tuning
# Optimized for high-throughput ZRAM combined with SSD secondary swap

# Aggressively prioritize ZRAM compressed paging over disk cache eviction
vm.swappiness = 150

# Begin background writeout of dirty pages early to avoid IO stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Favor directory and inode metadata caching in RAM
vm.vfs_cache_pressure = 50

# Disable multi-page speculative swap readahead (critical for ZRAM zero-latency)
vm.page-cluster = 0

# Limit maximum dirty memory bytes as an extra safety measure
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
