<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" width="2560" height="1600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="2560" height="1600" fill="url(#bg)"/>

  <!-- Glowing organic orbs -->
  <circle cx="650" cy="500" r="480" fill="url(#accent1)" filter="url(#blurFilter)"/>
  <circle cx="1900" cy="1100" r="550" fill="url(#accent2)" filter="url(#blurFilter)"/>
  <circle cx="1300" cy="800" r="380" fill="#94e2d5" fill-opacity="0.08" filter="url(#blurFilter)"/>

  <!-- Minimalist central geometric motif -->
  <g transform="translate(1280, 800)" stroke="rgba(205, 214, 244, 0.15)" stroke-width="1.5" fill="none">
    <polygon points="0,-160 138.56,-80 138.56,80 0,160 -138.56,80 -138.56,-80" />
    <polygon points="0,-120 103.92,-60 103.92,60 0,120 -103.92,60 -103.92,-60" stroke="rgba(137, 180, 250, 0.3)" />
    <circle r="4" fill="#89b4fa"/>
  </g>
</svg>
